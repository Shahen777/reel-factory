[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reel-factory"
version = "0.1.0"
description = "Beat-synced short-form video montage (Reels, TikTok, Shorts) for Claude Code and Codex"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["numpy", "Pillow>=9", "librosa>=0.10"]
keywords = ["video", "montage", "reels", "tiktok", "shorts", "ffmpeg", "claude-code", "codex"]

[project.optional-dependencies]
speech = ["faster-whisper>=1.0"]
motion = ["playwright>=1.40"]
download = ["yt-dlp"]
all = ["faster-whisper>=1.0", "playwright>=1.40", "yt-dlp"]
dev = ["pytest"]

[project.scripts]
reel = "reelfactory.cli:main"

[tool.setuptools]
packages = ["reelfactory"]

[tool.setuptools.package-data]
reelfactory = ["assets/fonts/*", "assets/motion/*"]
